<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgGranite" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#191610" />
      <stop offset="55%" stop-color="#0a0907" />
      <stop offset="100%" stop-color="#040302" />
    </radialGradient>

    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6e5" />
      <stop offset="30%" stop-color="#c9a96e" />
      <stop offset="60%" stop-color="#917135" />
      <stop offset="85%" stop-color="#f0e2ca" />
      <stop offset="100%" stop-color="#735220" />
    </linearGradient>

    <linearGradient id="edgeGilt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="40%" stop-color="#c9a96e" />
      <stop offset="100%" stop-color="#694d1b" />
    </linearGradient>

    <linearGradient id="cardFace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17140f" />
      <stop offset="100%" stop-color="#090806" />
    </linearGradient>

    <linearGradient id="cardFace2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1a13" />
      <stop offset="100%" stop-color="#0c0a07" />
    </linearGradient>

    <filter id="stackShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <filter id="cardFloatShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="-15" dy="32" stdDeviation="35" flood-color="#000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#c9a96e" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGranite)" />

  <!-- Studio spotlight -->
  <ellipse cx="600" cy="320" rx="420" ry="250" fill="#c9a96e" opacity="0.035" filter="blur(70px)" />

  <!-- ── CARD STACK (Simulating 250 premium cards box/stack) ── -->
  <g transform="translate(320, 240) rotate(-14)" filter="url(#stackShadow)">
    <!-- Stack thickness / Gilded gold edges -->
    <path d="M 0 200 L 0 245 L 340 245 L 340 200 Z" fill="url(#edgeGilt)" />
    <path d="M 340 0 L 375 25 L 375 270 L 340 245 Z" fill="url(#edgeGilt)" opacity="0.9" />

    <!-- Repeated subtle card layer lines -->
    <line x1="0" y1="210" x2="340" y2="210" stroke="#4a3715" stroke-width="0.75" />
    <line x1="0" y1="220" x2="340" y2="220" stroke="#4a3715" stroke-width="0.75" />
    <line x1="0" y1="230" x2="340" y2="230" stroke="#4a3715" stroke-width="0.75" />
    <line x1="0" y1="240" x2="340" y2="240" stroke="#4a3715" stroke-width="0.75" />

    <!-- Top Card in Stack (Face Up) -->
    <rect width="340" height="200" rx="4" fill="url(#cardFace1)" stroke="rgba(201,169,110,0.3)" stroke-width="1" />
    
    <!-- Blind Deboss / Gold Stamp on Stack Card -->
    <g transform="translate(170, 95)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#goldMetallic)" stroke-width="1.2" opacity="0.7" />
      <polygon points="0,-18 16,10 -16,10" fill="none" stroke="url(#goldMetallic)" stroke-width="1.6" />
      <text x="0" y="48" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="18" letter-spacing="4" fill="#f0e8d8">OG R A P H Y</text>
      <text x="0" y="62" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7" letter-spacing="3" fill="#c9a96e" opacity="0.6">PREMIUM COTTON STOCK · 600 GSM</text>
    </g>
  </g>

  <!-- ── FLOATING FEATURED CARD (Detailed Back Info) ── -->
  <g transform="translate(560, 160) rotate(12)" filter="url(#cardFloatShadow)">
    <rect width="350" height="205" rx="5" fill="url(#cardFace2)" stroke="url(#goldMetallic)" stroke-width="1.2" />

    <!-- Gold Foil Header Ribbon -->
    <line x1="0" y1="0" x2="350" y2="0" stroke="url(#goldMetallic)" stroke-width="3" />

    <!-- Cardholder Typography -->
    <g transform="translate(36, 42)">
      <text x="0" y="0" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="300" letter-spacing="1" fill="#f0e8d8">Dueng &amp; Partners</text>
      <text x="0" y="18" font-family="'Montserrat', sans-serif" font-size="7.5" letter-spacing="3" fill="#c9a96e">FOUNDER &amp; LEAD ARCHITECT</text>
      <line x1="0" y1="30" x2="90" y2="30" stroke="#c9a96e" stroke-width="1" opacity="0.5" />

      <g transform="translate(0, 60)" font-family="'Montserrat', sans-serif" font-size="8" fill="#e8d5b7" opacity="0.6">
        <text x="0" y="0">+1 (555) 019-2834</text>
        <text x="0" y="18">dueng@ography.studio</text>
        <text x="0" y="36">www.ography-v4.vercel.app</text>
        <text x="0" y="54">Mayfair, London · W1K 4QG</text>
      </g>

      <!-- Security Micro-Seal -->
      <g transform="translate(245, 80)">
        <circle cx="0" cy="0" r="22" fill="none" stroke="url(#goldMetallic)" stroke-width="0.8" opacity="0.6" stroke-dasharray="2,2" />
        <circle cx="0" cy="0" r="17" fill="none" stroke="url(#goldMetallic)" stroke-width="0.8" opacity="0.4" />
        <text x="0" y="4" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="11" fill="#c9a96e">OG</text>
      </g>
    </g>
  </g>

  <!-- Tag / Badge -->
  <g transform="translate(60, 560)">
    <rect width="210" height="42" rx="21" fill="rgba(15,13,10,0.85)" stroke="rgba(201,169,110,0.35)" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#c9a96e" />
    <text x="40" y="25" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="2" font-weight="500" fill="#f0e8d8">BUSINESS CARD SET</text>
  </g>

  <g transform="translate(60, 60)">
    <text x="0" y="0" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1" fill="#c9a96e" opacity="0.4">10 // PRINT &amp; PHYSICAL · 250 PACK</text>
  </g>
</svg>
